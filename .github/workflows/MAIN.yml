name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate snake (Radical theme)
        uses: Platane/snk@v3
        with:
          github_user_name: Sivaprasad-creator
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#ff0055&color_dots=#1a1b27,#ff0055,#bd93f9,#50fa7b,#f1fa8c

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
